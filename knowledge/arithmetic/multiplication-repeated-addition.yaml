schema_version: 1
id: arithmetic.multiplication.repeated-addition
title: Multiplication as repeated addition
aliases:
  - repeated addition
  - equal groups
  - groups of
keywords:
  - multiply
  - multiplication
  - repeated addition
  - equal groups
  - groups
  - rows
