difficulty: 4
summary: A written method for dividing by one digit, repeating divide, multiply, subtract and bring down for each place.
definition: >-
  Long division divides a larger number by a one- or two-digit divisor using a written method. For each
  place value, repeat four steps: divide, multiply, subtract, bring down. When fewer digits remain than the
  divisor, what is left is the remainder.
prerequisites:
  - arithmetic.division.basics
