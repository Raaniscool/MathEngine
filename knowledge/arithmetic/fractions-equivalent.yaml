subject: arithmetic
topic: fractions
subtopic: equivalent
difficulty: 3
summary: Multiplying or dividing the numerator and denominator by the same nonzero number gives an equivalent fraction.
definition: >-
  A fraction a/b names part of a whole. The numerator a is the number of parts, and the denominator b is the
  size of each part; b cannot be 0. Equivalent fractions name the same amount: multiply or divide the numerator and the denominator by the same nonzero number. A fraction is in lowest terms when its numerator and denominator have no common factor other than 1.
prerequisites:
  - arithmetic.number-theory.factors
  - arithmetic.division.basics
related:
  - arithmetic.fractions.add-subtract
  - arithmetic.fractions.multiply
formulas:
  - name: Equivalent fraction
    expression: a/b
    result: (a*k)/(b*k)
    variables:
      - symbol: a
        meaning: the numerator
      - symbol: b
        meaning: the denominator
      - symbol: k
        meaning: any nonzero whole number
    conditions:
      - b is not 0 and k is not 0
explanations:
  - level: intro
    text: >-
      One half and two quarters are the same amount. Cut a pizza into 4 slices: 2 of the 4 slices is half of the pizza.
  - level: standard
    text: >-
      Simplify 12/18 by dividing the top and bottom by 6: 12 / 6 = 2 and 18 / 6 = 3, so 12/18 = 2/3. Dividing by the greatest common factor gives lowest terms in one step.
worked_examples:
  - title: Simplifying 12/18
    problem: Write 12/18 in lowest terms.
    steps:
      - Common factors of 12 and 18 include 2, 3 and 6. The greatest is 6.
      - Divide the top and bottom by 6 to get 2 and 3.
      - 12 / 18 = 2 / 3
    answer: 2/3
exercises:
  - id: eighteen-twenty-fourths
    prompt: Write 18/24 in lowest terms.
    answer_type: number
    check:
      method: exact_numeric
      expected: 3/4
    hints:
      - The greatest common factor of 18 and 24 is 6.
    feedback_correct: Correct. 18/24 = 3/4.
    feedback_incorrect: Divide the top and bottom by the same number, such as 6.
  - id: missing-numerator
    prompt: Find the missing numerator. Two fifths equals the missing number over 10.
    answer_type: number
    check:
      method: exact_numeric
      expected: "4"
    hints:
      - To go from 5 to 10, multiply by 2. Do the same to the numerator.
    feedback_correct: Correct. 2/5 = 4/10.
    feedback_incorrect: Multiply the denominator 5 by 2 to get 10, then multiply the numerator 2 by 2.
  - id: simplify-forty-five-sixtieths
    prompt: Simplify 45/60 to lowest terms.
    answer_type: number
    check:
      method: exact_numeric
      expected: 3/4
    hints:
      - Both numbers are divisible by 15.
    feedback_correct: Correct. 45/60 = 3/4.
    feedback_incorrect: Divide both numbers by 15, the greatest common factor.
misconceptions:
  - description: Dividing only the top number when simplifying.
    explanation: 12/18 becomes 6/18 if only the top is divided by 2. 6/18 is 1/3, which is not 2/3.
    correction: Divide the numerator and the denominator by the same number, so 12/18 = 2/3.
  - description: Believing that fractions with different-looking numbers name different amounts.
    explanation: 2/4 and 1/2 look different, but both name half of a whole.
    correction: Equivalent fractions have the same value even when the numbers differ.
