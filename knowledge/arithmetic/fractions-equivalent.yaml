schema_version: 1
id: arithmetic.fractions.equivalent
title: Equivalent fractions and lowest terms
aliases:
  - equivalent fractions
  - simplifying fractions
  - reducing fractions
  - lowest terms
keywords:
  - fraction
  - numerator
  - denominator
  - equivalent
  - simplify
  - reduce
