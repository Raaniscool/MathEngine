difficulty: 4
summary: Evaluate parentheses, then exponents, then multiplication and division left to right, then addition and subtraction left to right.
definition: >-
  The order of operations is the agreed sequence for evaluating an expression: parentheses first, then exponents, then multiplication and division from left to right, then addition and subtraction from left to right. Multiplication and division have equal rank, and so do addition and subtraction. The memory aid PEMDAS or BODMAS does not mean multiplication always comes before division.
prerequisites:
  - arithmetic.multiplication.facts
  - arithmetic.integers.add-subtract
related:
  - arithmetic.exponents.powers
explanations:
  - level: intro
    text: >-
      Evaluate parentheses first. Then compute powers, then multiplication and division, and finally addition and subtraction.
  - level: standard
    text: >-
      For 18 / 3 x 2, multiplication and division have equal rank, so work left to right: 18 / 3 = 6, then 6 x 2 = 12.
worked_examples:
  - title: Parentheses, exponent, multiply, add
    problem: Evaluate 2 + 3 x (4 - 1)^2.
    steps:
      - Parentheses first. 4 - 1 = 3.
      - The exponent comes next, and 3^2 = 9.
      - Then multiply 3 x 9 = 27, and finally add 2 + 27 = 29.
      - 2 + 3 * (4 - 1)^2 = 2 + 3 * 3^2 = 2 + 3 * 9 = 2 + 27 = 29
    answer: "29"
exercises:
  - id: twelve-minus-two-times-five
    prompt: Evaluate 12 - 2 x 5.
    answer_type: number
    check:
      method: exact_numeric
      expected: "2"
    hints:
      - Multiply first, then subtract.
    feedback_correct: Correct. 2 x 5 = 10, then 12 - 10 = 2.
    feedback_incorrect: Multiplication comes before subtraction.
  - id: eighteen-divided-by-three-times-two
    prompt: Evaluate 18 / 3 x 2.
    answer_type: number
    check:
      method: exact_numeric
      expected: "12"
    hints:
      - Division and multiplication have equal rank, so work from left to right.
    feedback_correct: Correct. (18 / 3) x 2 = 6 x 2 = 12.
    feedback_incorrect: Divide first because it comes first from the left, then multiply.
  - id: two-times-seven-squared-minus-ten
    prompt: Evaluate 2 x (3 + 4)^2 - 10.
    answer_type: number
    check:
      method: exact_numeric
      expected: "88"
    hints:
      - Start with the parentheses, then the exponent.
    feedback_correct: Correct. 2 x 49 - 10 = 88.
    feedback_incorrect: Evaluate the parentheses, then the exponent, then multiply and subtract.
misconceptions:
  - description: Doing all multiplication before all division, so 18 / 3 x 2 = 18 / 6 = 3.
    explanation: Multiplication and division share a rank and are done left to right.
    correction: "(18 / 3) x 2 = 12."
  - description: Adding before multiplying because the addition is written first.
    explanation: Multiplication has a higher rank than addition, whatever the position.
    correction: "3 + 4 x 2 = 3 + 8 = 11, not 14."
