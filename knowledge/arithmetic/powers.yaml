subject: arithmetic
topic: exponents
subtopic: powers
difficulty: 3
summary: A power a^n with a whole-number exponent means the base multiplied by itself n times.
definition: >-
  A power a^n with a positive whole-number exponent n means a multiplied by itself n times. In 2^3 the base is 2 and the exponent is 3, so 2^3 = 2 x 2 x 2 = 8, not 2 x 3 = 6. Any nonzero number to the power 0 is 1, and 1 raised to any power is 1.
prerequisites:
  - arithmetic.multiplication.facts
related:
  - arithmetic.operations.order-of-operations
explanations:
  - level: intro
    text: >-
      An exponent counts how many times the base is multiplied by itself. 10^3 is 10 x 10 x 10 = 1000.
  - level: standard
    text: >-
      Squares and cubes are powers: 5^2 = 25 and 5^3 = 125. Powers grow quickly, which is why 2^10 is 1024.
worked_examples:
  - title: Evaluating a power
    problem: Evaluate 3^4.
    steps:
      - 3^4 means four factors of 3.
      - 3^4 = 3 * 3 * 3 * 3 = 81
    answer: "81"
exercises:
  - id: two-to-the-fifth
    prompt: What is 2^5?
    answer_type: number
    check:
      method: exact_numeric
      expected: "32"
    hints:
      - Multiply 2 by itself five times.
    feedback_correct: Correct. 2 x 2 x 2 x 2 x 2 = 32.
    feedback_incorrect: Write five factors of 2 and multiply them.
  - id: ten-cubed
    prompt: What is 10^3?
    answer_type: number
    check:
      method: exact_numeric
      expected: "1000"
    hints:
      - Three factors of 10.
    feedback_correct: Correct. 10 x 10 x 10 = 1000.
    feedback_incorrect: Multiply 10 by itself three times.
  - id: five-to-the-zero
    prompt: What is 5^0?
    answer_type: number
    check:
      method: exact_numeric
      expected: "1"
    hints:
      - Any nonzero base to the power 0 equals 1.
    feedback_correct: Correct. Any nonzero number to the power 0 is 1.
    feedback_incorrect: The power 0 always gives 1 for a nonzero base.
misconceptions:
  - description: Multiplying the base by the exponent, so 2^3 = 6.
    explanation: The exponent counts factors. It does not multiply the base.
    correction: "2^3 = 2 x 2 x 2 = 8."
  - description: Believing that 1 raised to a power gives the exponent, so 1^5 = 5.
    explanation: Each factor is 1, so the product stays 1 however many factors there are.
    correction: "1^5 = 1 x 1 x 1 x 1 x 1 = 1."

