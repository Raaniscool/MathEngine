subject: arithmetic
topic: multiplication
subtopic: facts
difficulty: 2
summary: Products of single-digit whole numbers, learned as facts and built from known patterns.
definition: >-
  A multiplication fact is a product of two single-digit whole numbers, such as 7 x 8 = 56. Students
  learn these facts so that larger calculations can be broken into known pieces. Strategies include
  splitting a factor (7 x 8 = 7 x 5 + 7 x 3) and using a nearby known fact (9 x 6 is one group of 6 less than 10 x 6).
prerequisites:
  - arithmetic.multiplication.repeated-addition
related:
  - arithmetic.division.basics
  - arithmetic.number-theory.factors
explanations:
  - level: intro
    text: >-
      Multiplication facts are the products you use again and again, like 3 x 4 = 12. Knowing them
      quickly makes division, fractions and algebra much easier.
  - level: standard
    text: >-
      Break an unknown fact into known facts. To find 7 x 8, use 7 x 5 = 35 and 7 x 3 = 21, then add:
      35 + 21 = 56. Repeated practice turns the strategy into memory.
  - level: advanced
    text: >-
      The distributive law, a x (b + c) = a x b + a x c, justifies every splitting strategy. Multiplication
      facts are therefore instances of one structure rather than isolated items to memorize.
formulas:
  - name: Distributive splitting
    expression: a*(b+c)
    result: a*b + a*c
    variables:
      - symbol: a
        meaning: a factor, for example 7
      - symbol: b
        meaning: first part of the other factor
      - symbol: c
        meaning: second part of the other factor
worked_examples:
  - title: Breaking a fact into easy pieces
    problem: Find 6 x 9 using a fact you already know.
    steps:
      - Start from 6 x 10, which is easy to remember.
      - 6 x 9 is one group of 6 less than 6 x 10.
      - 6 x 10 = 60
      - 6 x 9 = 60 - 6 = 54
    answer: "54"
exercises:
  - id: seven-times-eight
    prompt: What is 7 x 8?
    answer_type: number
    check:
      method: exact_numeric
      expected: "56"
    hints:
      - Split 8 into 5 + 3, then multiply 7 by each part.
      - 7 x 5 = 35 and 7 x 3 = 21. Add the two results.
    feedback_correct: Correct. 7 x 8 = 56.
    feedback_incorrect: Try splitting one factor into two easier parts.
  - id: eight-times-nine
    prompt: What is 8 x 9?
    answer_type: number
    check:
      method: exact_numeric
      expected: "72"
    hints:
      - 8 x 10 is 80, which is easy to find.
      - 8 x 9 is one group of 8 less than 8 x 10.
    feedback_correct: Correct. 8 x 9 = 72.
    feedback_incorrect: Start from 8 x 10 and subtract one group of 8.
  - id: simplify-with-y
    prompt: Simplify 3 x 2y x 2. Write the answer using y.
    answer_type: expression
    check:
      method: symbolic_equivalence
      expected: 12*y
    hints:
      - Multiply the number parts first, then keep the variable.
      - 3 x 2 x 2 = 12.
    feedback_correct: Correct. The numbers multiply to 12, and the variable y stays.
    feedback_incorrect: Multiply the numbers together first. The variable y is unchanged.
misconceptions:
  - description: Adding instead of multiplying, for example 6 x 4 = 10.
    explanation: 6 + 4 is an addition. The product 6 x 4 means six groups of four.
    correction: 6 x 4 = 4 + 4 + 4 + 4 + 4 + 4 = 24.
  - description: Using a fact that is almost right, such as 7 x 8 = 54.
    explanation: 54 is 6 x 9. Facts near each other are easy to confuse when they are not practised.
    correction: Check with splitting. 7 x 8 = 7 x 5 + 7 x 3 = 35 + 21 = 56.
