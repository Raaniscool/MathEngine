id: arithmetic.subtraction.whole-numbers
title: Subtracting whole numbers with borrowing
aliases:
  - subtracting whole numbers
  - subtraction with borrowing
  - borrowing in subtraction
  - regrouping subtraction
keywords:
  - subtract
  - subtraction
  - difference
