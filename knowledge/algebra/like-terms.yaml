schema_version: 1
id: algebra.expressions.like-terms
title: Combining like terms
aliases:
  - like terms
  - collecting like terms
  - simplifying expressions
  - combine like terms
keywords:
  - like terms
  - term
  - coefficient
  - variable
  - simplify
  - combine
  - expression
subject: algebra
topic: expressions
subtopic: like-terms
difficulty: 4
summary: Like terms have the same variable part, and only like terms can be combined by adding their coefficients.
definition: >-
  A term is a number, a variable, or a product of them, such as 4x or 5. Like terms have exactly the same variable part, meaning the same letters with the same exponents. Only like terms can be combined: 4x + 3x = 7x. The terms 4x and 3y are not like terms, and neither are x and x^2, so 4x + 3y and x + x^2 cannot be simplified further.
prerequisites:
  - algebra.expressions.evaluate
  - arithmetic.integers.add-subtract
related:
  - algebra.expressions.distributive
explanations:
  - level: intro
    text: >-
      Apples and oranges cannot be added to make one kind of fruit, but 4 apples and 3 apples make 7 apples. In algebra, x and y are different kinds.
  - level: standard
    text: >-
      To simplify 6x^2 + 3x - x^2 + 2x, group the terms with the same variable part: (6x^2 - x^2) + (3x + 2x) = 5x^2 + 5x.
worked_examples:
  - title: Grouping like terms
    problem: Simplify 5a + 2b - 3a + 4b.
    steps:
      - Group the a terms and the b terms. The a terms are 5a and -3a. The b terms are 2b and 4b.
      - 5a - 3a = 2a and 2b + 4b = 6b.
      - The simplified expression is 2a + 6b.
    answer: 2a + 6b
exercises:
  - id: seven-x-plus-two-x-minus-four-x
    prompt: Simplify 7x + 2x - 4x.
    answer_type: expression
    check:
      method: symbolic_equivalence
      expected: 5*x
    hints:
      - All three terms have the same variable part, x.
    feedback_correct: Correct. 7 + 2 - 4 = 5, so the answer is 5x.
    feedback_incorrect: Add the coefficients 7, 2 and -4 and keep the variable x.
  - id: three-a-plus-two-b-plus-a-minus-b
    prompt: Simplify 3a + 2b + a - b.
    answer_type: expression
    check:
      method: symbolic_equivalence
      expected: 4*a + b
    hints:
      - The a terms are 3a and a. The b terms are 2b and -b.
    feedback_correct: Correct. 4a + b.
    feedback_incorrect: Combine the a terms and the b terms separately.
  - id: six-x-squared-plus-three-x-minus-x-squared-plus-two-x
    prompt: Simplify 6x^2 + 3x - x^2 + 2x.
    answer_type: expression
    check:
      method: symbolic_equivalence
      expected: 5*x^2 + 5*x
    hints:
      - x^2 and x are different like-term groups. Keep them apart.
    feedback_correct: Correct. 5x^2 + 5x.
    feedback_incorrect: Group the x^2 terms together, then group the x terms.
misconceptions:
  - description: Combining unlike terms, so 3x + 2 = 5x.
    explanation: 3x and 2 have different variable parts, so they cannot be combined.
    correction: 3x + 2 stays as it is.
  - description: Adding exponents when adding terms, so x^2 + x^2 = x^4.
    explanation: Adding like terms adds their coefficients. The variable part stays the same.
    correction: x^2 + x^2 = 2x^2.
