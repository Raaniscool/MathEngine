schema_version: 1
id: algebra.expressions.evaluate
title: Evaluating algebraic expressions
aliases:
  - substitution
  - evaluate an expression
  - plug in values
  - evaluating expressions
keywords:
  - variable
  - expression
  - substitute
  - substitution
  - evaluate
  - coefficient
